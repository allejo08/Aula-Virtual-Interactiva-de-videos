<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plataforma Educativa - Panel Docente</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans antialiased">

    <div class="flex h-screen overflow-hidden">
        <!-- Menú Lateral -->
        <aside class="w-64 bg-slate-900 text-white flex flex-col shadow-lg">
            <div class="p-5 text-xl font-bold border-b border-slate-800">Menú Docente</div>
            <nav class="flex-1 p-4 space-y-2 overflow-y-auto">
                <button onclick="mostrarDashboard()" class="w-full flex items-center gap-3 px-4 py-2.5 rounded-lg bg-blue-600 hover:bg-blue-700 transition font-medium text-left">
                    📊 Dashboard
                </button>
                <button onclick="mostrarFormularioActividad()" class="w-full flex items-center gap-3 px-4 py-2.5 rounded-lg hover:bg-slate-800 transition font-medium text-left text-slate-300">
                    ➕ Añadir Actividad
                </button>
                
                <div class="pt-4 pb-2 text-xs font-semibold text-slate-400 uppercase tracking-wider">Grupos</div>
                <div class="space-y-1">
                    <button onclick="filtrarPorGrupo('Sexto 1')" class="w-full text-left px-4 py-2 rounded hover:bg-slate-800 text-slate-300 transition text-sm">Sexto 1</button>
                    <button onclick="filtrarPorGrupo('Sexto 2')" class="w-full text-left px-4 py-2 rounded hover:bg-slate-800 text-slate-300 transition text-sm">Sexto 2</button>
                    <button onclick="filtrarPorGrupo('Séptimo')" class="w-full text-left px-4 py-2 rounded hover:bg-slate-800 text-slate-300 transition text-sm">Séptimo</button>
                    <button onclick="filtrarPorGrupo('Octavo 1')" class="w-full text-left px-4 py-2 rounded hover:bg-slate-800 text-slate-300 transition text-sm">Octavo 1</button>
                    <button onclick="filtrarPorGrupo('Octavo 2')" class="w-full text-left px-4 py-2 rounded hover:bg-slate-800 text-slate-300 transition text-sm">Octavo 2</button>
                    <button onclick="filtrarPorGrupo('Noveno')" class="w-full text-left px-4 py-2 rounded hover:bg-slate-800 text-slate-300 transition text-sm">Noveno</button>
                    <button onclick="filtrarPorGrupo('Décimo')" class="w-full text-left px-4 py-2 rounded hover:bg-slate-800 text-slate-300 transition text-sm">Décimo</button>
                    <button onclick="filtrarPorGrupo('Once')" class="w-full text-left px-4 py-2 rounded hover:bg-slate-800 text-slate-300 transition text-sm">Once</button>
                </div>
            </nav>
        </aside>

        <!-- Contenido Principal -->
        <main class="flex-1 flex flex-col overflow-y-auto">
            <header class="bg-white shadow-sm h-16 flex items-center justify-between px-8 border-b">
                <h1 id="tituloSeccion" class="text-xl font-bold text-slate-800">Dashboard General</h1>
                <button onclick="generarReporteGlobal()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition shadow-sm">
                    Generar Reporte Global
                </button>
            </header>

            <div id="contenidoDinamico" class="p-8">
                <!-- El contenido se inyecta dinámicamente aquí -->
            </div>
        </main>
    </div>

    <script>
        // Simulación de datos locales o conexión con Google Sheets / Backend
        let actividades = [
            { id: "ACT_179027007", fecha: "24/9/2026", grado: "Sexto 1", link: "https://www.youtube.com/watch?v=G84CdSrYqcc", titulo: "Análisis Pitch de negocios", objetivo: "Identificar elementos clave de un pitch.", descripcion: "Analizar el caso real de emprendimiento." }
        ];

        function normalizarGrado(g) {
            if (!g) return "";
            let val = g.toString().trim().toLowerCase();
            if (val === "6-1" || val === "6.1" || val === "sexto 1" || val === "sexto-1") return "Sexto 1";
            if (val === "6-2" || val === "6.2" || val === "sexto 2" || val === "sexto-2") return "Sexto 2";
            if (val === "7" || val === "séptimo" || val === "septimo") return "Séptimo";
            if (val === "8-1" || val === "octavo 1") return "Octavo 1";
            if (val === "8-2" || val === "octavo 2") return "Octavo 2";
            if (val === "9" || val === "noveno") return "Noveno";
            if (val === "10" || val === "décimo" || val === "decimo") return "Décimo";
            if (val === "11" || val === "once") return "Once";
            return g;
        }

        function mostrarDashboard() {
            document.getElementById('tituloSeccion').innerText = "Dashboard General";
            const contenedor = document.getElementById('contenidoDinamico');
            
            contenedor.innerHTML = `
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                    <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                        <h4 class="text-sm font-semibold text-slate-500 uppercase">Total Actividades</h4>
                        <p class="text-3xl font-bold text-slate-900 mt-2">${actividades.length}</p>
                    </div>
                    <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                        <h4 class="text-sm font-semibold text-slate-500 uppercase">Grupos Registrados</h4>
                        <p class="text-3xl font-bold text-slate-900 mt-2">8</p>
                    </div>
                    <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                        <h4 class="text-sm font-semibold text-slate-500 uppercase">Estado del Sistema</h4>
                        <p class="text-3xl font-bold text-emerald-600 mt-2">Activo</p>
                    </div>
                </div>

                <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6">
                    <h3 class="text-lg font-bold text-slate-800 mb-4">Actividades Recientes Creadas</h3>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="border-b text-xs font-semibold text-slate-500 uppercase bg-slate-50">
                                    <th class="p-3">ID Actividad</th>
                                    <th class="p-3">Grado</th>
                                    <th class="p-3">Título</th>
                                    <th class="p-3">Fecha</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y text-sm text-slate-700">
                                ${actividades.map(a => `
                                    <tr>
                                        <td class="p-3 font-mono text-xs text-blue-600">${a.id}</td>
                                        <td class="p-3 font-medium">${a.grado}</td>
                                        <td class="p-3">${a.titulo}</td>
                                        <td class="p-3 text-slate-500">${a.fecha}</td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        function filtrarPorGrupo(grupoSeleccionado) {
            const grupoNormalizado = normalizarGrado(grupoSeleccionado);
            document.getElementById('tituloSeccion').innerText = `Reporte del Grupo: ${grupoNormalizado}`;
            const contenedor = document.getElementById('contenidoDinamico');

            const filtradas = actividades.filter(a => normalizarGrado(a.grado) === grupoNormalizado);

            contenedor.innerHTML = `
                <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 mb-6">
                    <h3 class="text-lg font-bold text-slate-800 mb-2">Actividades asignadas a ${grupoNormalizado}</h3>
                    <p class="text-sm text-slate-500 mb-4">Aquí puedes visualizar las notas y el rendimiento de los estudiantes de este grupo específico.</p>
                    
                    ${filtradas.length > 0 ? `
                        <div class="space-y-4">
                            ${filtradas.map(act => `
                                <div class="border rounded-lg p-4 bg-slate-50 flex justify-between items-center">
                                    <div>
                                        <span class="text-xs font-bold text-indigo-600">${act.id}</span>
                                        <h4 class="font-bold text-slate-800 text-base">${act.titulo}</h4>
                                        <p class="text-sm text-slate-600">${act.objetivo}</p>
                                        <a href="${act.link}" target="_blank" class="text-xs text-blue-600 hover:underline mt-1 inline-block">Ver Video de YouTube ↗</a>
                                    </div>
                                    <span class="bg-emerald-100 text-emerald-800 text-xs font-semibold px-2.5 py-1 rounded">Activa</span>
                                </div>
                            `).join('')}
                        </div>
                    ` : `
                        <div class="p-8 text-center text-slate-500 bg-slate-50 rounded-lg border border-dashed">
                            No hay actividades registradas para este grupo todavía. Haz clic en "Añadir Actividad" para crear una.
                        </div>
                    `}
                </div>
            `;
        }

        function mostrarFormularioActividad() {
            document.getElementById('tituloSeccion').innerText = "Crear Nueva Actividad";
            const contenedor = document.getElementById('contenidoDinamico');

            contenedor.innerHTML = `
                <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-8 max-w-2xl mx-auto">
                    <form onsubmit="guardarActividad(event)" class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Grado Destino</label>
                            <select id="formGrado" class="w-full border rounded-lg p-2.5 text-sm bg-slate-50">
                                <option value="Sexto 1">Sexto 1</option>
                                <option value="Sexto 2">Sexto 2</option>
                                <option value="Séptimo">Séptimo</option>
                                <option value="Octavo 1">Octavo 1</option>
                                <option value="Octavo 2">Octavo 2</option>
                                <option value="Noveno">Noveno</option>
                                <option value="Décimo">Décimo</option>
                                <option value="Once">Once</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Link de YouTube</label>
                            <input type="url" id="formLink" required placeholder="https://www.youtube.com/watch?v=..." class="w-full border rounded-lg p-2.5 text-sm">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Título de la Clase</label>
                            <input type="text" id="formTitulo" required placeholder="Ej: Análisis Pitch de negocios" class="w-full border rounded-lg p-2.5 text-sm">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Objetivo de la Actividad</label>
                            <input type="text" id="formObjetivo" required placeholder="Ej: Reconocer las fases de..." class="w-full border rounded-lg p-2.5 text-sm">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Descripción</label>
                            <textarea id="formDescripcion" rows="3" class="w-full border rounded-lg p-2.5 text-sm" placeholder="Instrucciones para los estudiantes..."></textarea>
                        </div>
                        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2.5 rounded-lg font-medium transition shadow-sm">
                            Guardar Actividad
                        </button>
                    </form>
                </div>
            `;
        }

        function guardarActividad(e) {
            e.preventDefault();
            const nuevaAct = {
                id: "ACT_" + Math.floor(Math.random() * 900000000 + 100000000),
                fecha: new Date().toLocaleDateString(),
                grado: document.getElementById('formGrado').value,
                link: document.getElementById('formLink').value,
                titulo: document.getElementById('formTitulo').value,
                objetivo: document.getElementById('formObjetivo').value,
                descripcion: document.getElementById('formDescripcion').value
            };
            actividades.push(nuevaAct);
            alert("¡Actividad creada exitosamente!");
            mostrarDashboard();
        }

        function generarReporteGlobal() {
            alert("Generando reporte global de calificaciones y asistencias...");
        }

        // Cargar Dashboard por defecto al abrir la página
        window.onload = function() {
            mostrarDashboard();
        };
    </script>
</body>
</html>
