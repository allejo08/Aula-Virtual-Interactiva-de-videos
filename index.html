<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plataforma Educativa - Portal Docente</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 font-sans antialiased text-slate-800">

    <!-- ================= PANTALLA DE SELECCIÓN DE ROL / LOGIN ================= -->
    <div id="pantallaLogin" class="min-h-screen flex items-center justify-center p-4">
        <div class="bg-white p-8 rounded-2xl shadow-xl max-w-md w-full border border-slate-200 text-center">
            <div class="w-16 h-16 bg-blue-600 text-white rounded-2xl flex items-center justify-center mx-auto mb-4 text-2xl shadow-md">
                🎓
            </div>
            <h2 class="text-2xl font-bold text-slate-900 mb-2">Plataforma Educativa</h2>
            <p class="text-sm text-slate-500 mb-6">Selecciona tu perfil para ingresar al sistema</p>

            <div class="space-y-4">
                <button onclick="iniciarSesion('docente')" class="w-full flex items-center justify-center gap-3 bg-slate-900 hover:bg-slate-800 text-white font-medium py-3 px-4 rounded-xl transition shadow">
                    👨‍🏫 Ingresar como Docente
                </button>
                <button onclick="iniciarSesion('estudiante')" class="w-full flex items-center justify-center gap-3 bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 px-4 rounded-xl transition shadow">
                    👨‍🎓 Ingresar como Estudiante
                </button>
            </div>
        </div>
    </div>

    <!-- ================= PANEL DOCENTE ================= -->
    <div id="panelDocente" class="hidden flex h-screen overflow-hidden">
        <!-- Menú Lateral -->
        <aside class="w-64 bg-slate-900 text-white flex flex-col shadow-xl z-20">
            <div class="p-5 border-b border-slate-800 flex items-center justify-between">
                <span class="text-lg font-bold tracking-wide">Menú Docente</span>
                <span class="bg-emerald-500/20 text-emerald-400 text-xs px-2 py-0.5 rounded font-mono">En línea</span>
            </div>

            <nav class="flex-1 p-4 space-y-2 overflow-y-auto">
                <button onclick="mostrarDashboard()" class="w-full flex items-center gap-3 px-4 py-2.5 rounded-lg bg-blue-600 hover:bg-blue-700 transition font-medium text-left text-sm">
                    📊 Dashboard
                </button>
                <button onclick="mostrarFormularioActividad()" class="w-full flex items-center gap-3 px-4 py-2.5 rounded-lg hover:bg-slate-800 transition font-medium text-left text-slate-300 text-sm">
                    ➕ Añadir Actividad
                </button>
                <button onclick="mostrarGestionEstudiantes()" class="w-full flex items-center gap-3 px-4 py-2.5 rounded-lg hover:bg-slate-800 transition font-medium text-left text-slate-300 text-sm">
                    👨‍🎓 Gestión de Estudiantes
                </button>
                
                <div class="pt-5 pb-2 text-xs font-semibold text-slate-400 uppercase tracking-wider">Grupos</div>
                <div class="space-y-1" id="listaGruposDocente">
                    <!-- Se generan dinámicamente -->
                </div>
            </nav>

            <!-- Botón Cerrar Sesión -->
            <div class="p-4 border-t border-slate-800 bg-slate-950/40">
                <button onclick="cerrarSesion()" class="w-full flex items-center justify-center gap-2 px-4 py-2.5 rounded-lg bg-rose-600/20 hover:bg-rose-600 text-rose-300 hover:text-white transition font-medium text-sm">
                    🚪 Cerrar Sesión
                </button>
            </div>
        </aside>

        <!-- Área Principal de Trabajo -->
        <main class="flex-1 flex flex-col overflow-y-auto">
            <header class="bg-white shadow-sm h-16 flex items-center justify-between px-8 border-b border-slate-200">
                <h1 id="tituloSeccion" class="text-xl font-bold text-slate-800">Dashboard General</h1>
                <button onclick="mostrarReporteGlobalInteractivo()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition shadow-sm">
                    📈 Reporte Global Interactivo
                </button>
            </header>

            <div id="contenidoDinamico" class="p-8">
                <!-- Vistas dinámicas -->
            </div>
        </main>
    </div>

    <!-- ================= VISTA ESTUDIANTE ================= -->
    <div id="panelEstudiante" class="hidden min-h-screen bg-slate-50 p-8">
        <div class="max-w-4xl mx-auto">
            <div class="flex justify-between items-center bg-white p-6 rounded-2xl shadow-sm mb-6 border">
                <div>
                    <h2 class="text-xl font-bold text-slate-800">Portal Estudiantil</h2>
                    <p class="text-sm text-slate-500">Grupo: Sexto 1</p>
                </div>
                <button onclick="cerrarSesion()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 text-sm font-medium px-4 py-2 rounded-lg transition">
                    Cerrar Sesión
                </button>
            </div>
            <div class="bg-white p-6 rounded-2xl shadow-sm border">
                <h3 class="font-bold text-slate-800 mb-4">Tus Actividades Asignadas</h3>
                <div id="listaActividadesEstudiante" class="space-y-3"></div>
            </div>
        </div>
    </div>

    <script>
        const GRUPOS = [
            "Sexto 1", "Sexto 2", "Séptimo", "Octavo 1", 
            "Octavo 2", "Noveno", "Décimo", "Once"
        ];

        // Base de datos de ejemplo en memoria
        let actividades = [
            { 
                id: "ACT_179027007", 
                fecha: "24/9/2026", 
                grado: "Sexto 1", 
                link: "https://www.youtube.com/watch?v=G84CdSrYqcc", 
                titulo: "Análisis Pitch de negocios", 
                objetivo: "Identificar elementos clave de un pitch de negocios.", 
                descripcion: "Analizar el caso real de emprendimiento infantil en Shark Tank.",
                activa: true,
                estudiantesTotal: 32,
                estudiantesCompletados: 26,
                promedioCalificacion: 4.3
            }
        ];

        let estudiantes = [
            { id: 1, nombre: "Camila Andrea Morales", grado: "Sexto 1", correo: "camila@colombia.edu.co" },
            { id: 2, nombre: "Juan David Sánchez", grado: "Sexto 1", correo: "juan@colombia.edu.co" },
            { id: 3, nombre: "Mateo Gómez Ríos", grado: "Séptimo", correo: "mateo@colombia.edu.co" }
        ];

        function normalizarGrado(g) {
            if (!g) return "";
            let val = g.toString().trim().toLowerCase();
            if (val === "6-1" || val === "6.1" || val === "sexto 1" || val === "sexto-1") return "Sexto 1";
            if (val === "6-2" || val === "6.2" || val === "sexto 2" || val === "sexto-2") return "Sexto 2";
            if (val === "7" || val === "séptimo" || val === "septimo") return "Séptimo";
            if (val === "8-1" || val === "octavo 1") return "Octavo 1";
            if (val === "8-2" || val === "octavo 2") return "Octavo 2";
            if (val === "9" || val === "noveno") return "Noveno";
            if (val === "10" || val === "décimo" || val === "decimo") return "Décimo";
            if (val === "11" || val === "once") return "Once";
            return g;
        }

        function iniciarSesion(rol) {
            sessionStorage.setItem("rol_activo", rol);
            aplicarEstadoSesion();
        }

        function cerrarSesion() {
            sessionStorage.removeItem("rol_activo");
            aplicarEstadoSesion();
        }

        function aplicarEstadoSesion() {
            const rol = sessionStorage.getItem("rol_activo");
            const pantallaLogin = document.getElementById("pantallaLogin");
            const panelDocente = document.getElementById("panelDocente");
            const panelEstudiante = document.getElementById("panelEstudiante");

            pantallaLogin.classList.add("hidden");
            panelDocente.classList.add("hidden");
            panelEstudiante.classList.add("hidden");

            if (rol === "docente") {
                panelDocente.classList.remove("hidden");
                renderMenuGrupos();
                mostrarDashboard();
            } else if (rol === "estudiante") {
                panelEstudiante.classList.remove("hidden");
                cargarVistaEstudiante();
            } else {
                pantallaLogin.classList.remove("hidden");
            }
        }

        function renderMenuGrupos() {
            const contenedor = document.getElementById("listaGruposDocente");
            contenedor.innerHTML = GRUPOS.map(grupo => `
                <button onclick="filtrarPorGrupo('${grupo}')" class="w-full text-left px-4 py-2 rounded-lg hover:bg-slate-800 text-slate-300 transition text-sm flex justify-between items-center">
                    <span>${grupo}</span>
                    <span class="text-xs bg-slate-800 px-1.5 py-0.5 rounded text-slate-400 font-mono">
                        ${actividades.filter(a => normalizarGrado(a.grado) === grupo).length}
                    </span>
                </button>
            `).join('');
        }

        // --- DASHBOARD DOCENTE ---
        function mostrarDashboard() {
            document.getElementById('tituloSeccion').innerText = "Dashboard General";
            const contenedor = document.getElementById('contenidoDinamico');

            const totalActividades = actividades.length;
            const totalAlumnos = estudiantes.length;

            const statsPorGrado = GRUPOS.map(grupo => {
                const acts = actividades.filter(a => normalizarGrado(a.grado) === grupo);
                const alumsGrupo = estudiantes.filter(e => normalizarGrado(e.grado) === grupo).length;
                if (acts.length === 0) return { grupo, avance: 0, promedio: 0, totalActs: 0, alumsGrupo };
                
                const prom = (acts.reduce((acc, curr) => acc + (curr.promedioCalificacion || 0), 0) / acts.length).toFixed(1);
                return { grupo, avance: 75, promedio: prom, totalActs: acts.length, alumsGrupo };
            });

            contenedor.innerHTML = `
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                        <h4 class="text-xs font-bold text-slate-400 uppercase tracking-wider">Total Actividades</h4>
                        <p class="text-3xl font-extrabold text-slate-900 mt-2">${totalActividades}</p>
                    </div>
                    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                        <h4 class="text-xs font-bold text-slate-400 uppercase tracking-wider">Estudiantes Matriculados</h4>
                        <p class="text-3xl font-extrabold text-indigo-600 mt-2">${totalAlumnos}</p>
                    </div>
                    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                        <h4 class="text-xs font-bold text-slate-400 uppercase tracking-wider">Grupos Activos</h4>
                        <p class="text-3xl font-extrabold text-emerald-600 mt-2">${GRUPOS.length}</p>
                    </div>
                </div>

                <!-- Avance por Grados -->
                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 mb-8">
                    <h3 class="text-base font-bold text-slate-800 mb-4">Resumen Estadístico por Grados</h3>
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                        ${statsPorGrado.map(st => `
                            <div class="p-4 rounded-xl border border-slate-100 bg-slate-50/50">
                                <div class="flex justify-between items-center mb-2">
                                    <span class="font-bold text-sm text-slate-800">${st.grupo}</span>
                                    <span class="text-xs font-bold px-2 py-0.5 rounded ${st.promedio >= 4.0 ? 'bg-emerald-100 text-emerald-800' : 'bg-slate-200 text-slate-700'}">
                                        Nota: ${st.promedio > 0 ? st.promedio : 'S/N'}
                                    </span>
                                </div>
                                <p class="text-xs text-slate-500 mb-1">Estudiantes: ${st.alumsGrupo}</p>
                                <div class="w-full bg-slate-200 rounded-full h-2 mb-1">
                                    <div class="bg-blue-600 h-2 rounded-full" style="width: ${st.avance}%"></div>
                                </div>
                                <span class="text-[11px] text-slate-400">${st.totalActs} actividad(es) creadas</span>
                            </div>
                        `).join('')}
                    </div>
                </div>

                <!-- Actividades Recientes -->
                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
                    <h3 class="text-base font-bold text-slate-800 mb-4">Listado General de Actividades</h3>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="border-b text-xs font-semibold text-slate-400 uppercase bg-slate-50/50">
                                    <th class="p-3">Título</th>
                                    <th class="p-3">Grado</th>
                                    <th class="p-3">Fecha</th>
                                    <th class="p-3 text-right">Acciones</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y text-sm">
                                ${actividades.map(a => `
                                    <tr class="hover:bg-slate-50 transition">
                                        <td class="p-3 font-medium text-slate-800 cursor-pointer" onclick="verEstadisticasActividad('${a.id}')">${a.titulo}</td>
                                        <td class="p-3 text-slate-600">${a.grado}</td>
                                        <td class="p-3 text-slate-400 text-xs">${a.fecha}</td>
                                        <td class="p-3 text-right space-x-2">
                                            <button onclick="verEstadisticasActividad('${a.id}')" class="text-xs bg-blue-50 text-blue-600 px-2.5 py-1 rounded font-medium">Ver Reporte</button>
                                            <button onclick="cargarFormularioModificar('${a.id}')" class="text-xs bg-amber-50 text-amber-600 px-2.5 py-1 rounded font-medium">Modificar</button>
                                            <button onclick="eliminarActividad('${a.id}')" class="text-xs bg-rose-50 text-rose-600 px-2.5 py-1 rounded font-medium">Eliminar</button>
                                        </td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        // --- GESTIÓN DE ESTUDIANTES (NUEVA PESTAÑA) ---
        function mostrarGestionEstudiantes() {
            document.getElementById('tituloSeccion').innerText = "Gestión de Estudiantes";
            const contenedor = document.getElementById('contenidoDinamico');

            contenedor.innerHTML = `
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                    <!-- Formulario de Registro -->
                    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 h-fit">
                        <h3 class="font-bold text-slate-800 mb-4">Añadir Nuevo Estudiante</h3>
                        <form onsubmit="registrarEstudiante(event)" class="space-y-4">
                            <div>
                                <label class="block text-xs font-semibold text-slate-600 mb-1">Nombre Completo</label>
                                <input type="text" id="nombreEstudiante" required class="w-full border rounded-xl p-2.5 text-sm" placeholder="Ej: Ana María Pérez">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-600 mb-1">Grado</label>
                                <select id="gradoEstudiante" class="w-full border rounded-xl p-2.5 text-sm bg-slate-50">
                                    ${GRUPOS.map(g => `<option value="${g}">${g}</option>`).join('')}
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-600 mb-1">Correo Electrónico</label>
                                <input type="email" id="correoEstudiante" required class="w-full border rounded-xl p-2.5 text-sm" placeholder="correo@colombia.edu.co">
                            </div>
                            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 rounded-xl transition shadow">
                                Registrar Estudiante
                            </button>
                        </form>
                    </div>

                    <!-- Listado de Estudiantes Registrados -->
                    <div class="lg:col-span-2 bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                        <h3 class="font-bold text-slate-800 mb-4">Estudiantes Matriculados (${estudiantes.length})</h3>
                        <div class="overflow-x-auto max-h-[500px] overflow-y-auto">
                            <table class="w-full text-left text-sm">
                                <thead class="bg-slate-50 text-xs font-semibold text-slate-400 border-b sticky top-0">
                                    <tr>
                                        <th class="p-3">Nombre</th>
                                        <th class="p-3">Grado</th>
                                        <th class="p-3">Correo</th>
                                        <th class="p-3 text-right">Acción</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y text-slate-700">
                                    ${estudiantes.map(e => `
                                        <tr>
                                            <td class="p-3 font-medium">${e.nombre}</td>
                                            <td class="p-3">${e.grado}</td>
                                            <td class="p-3 text-slate-500 text-xs">${e.correo}</td>
                                            <td class="p-3 text-right">
                                                <button onclick="eliminarEstudiante(${e.id})" class="text-rose-600 hover:text-rose-800 text-xs font-semibold">Eliminar</button>
                                            </td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            `;
        }

        function registrarEstudiante(e) {
            e.preventDefault();
            const nuevo = {
                id: Date.now(),
                nombre: document.getElementById('nombreEstudiante').value,
                grado: document.getElementById('gradoEstudiante').value,
                correo: document.getElementById('correoEstudiante').value
            };
            estudiantes.push(nuevo);
            alert("¡Estudiante registrado con éxito!");
            mostrarGestionEstudiantes();
        }

        function eliminarEstudiante(id) {
            estudiantes = estudiantes.filter(e => e.id !== id);
            mostrarGestionEstudiantes();
        }

        // --- FORMULARIO DE CREACIÓN CON PREGUNTAS ABAJO ---
        function mostrarFormularioActividad() {
            document.getElementById('tituloSeccion').innerText = "Crear Nueva Actividad";
            const contenedor = document.getElementById('contenidoDinamico');

            contenedor.innerHTML = `
                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-8 max-w-3xl mx-auto">
                    <form onsubmit="guardarActividad(event)" class="space-y-6">
                        <div class="space-y-4">
                            <h3 class="font-bold text-slate-800 border-b pb-2">1. Información General del Video</h3>
                            <div>
                                <label class="block text-xs font-semibold text-slate-600 mb-1">Grado Destino</label>
                                <select id="formGrado" class="w-full border rounded-xl p-2.5 text-sm bg-slate-50">
                                    ${GRUPOS.map(g => `<option value="${g}">${g}</option>`).join('')}
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-600 mb-1">Link de YouTube</label>
                                <input type="url" id="formLink" required placeholder="https://www.youtube.com/watch?v=..." class="w-full border rounded-xl p-2.5 text-sm">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-600 mb-1">Título de la Clase</label>
                                <input type="text" id="formTitulo" required placeholder="Ej: Análisis Pitch de negocios" class="w-full border rounded-xl p-2.5 text-sm">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-600 mb-1">Objetivo</label>
                                <input type="text" id="formObjetivo" required placeholder="Ej: Identificar los elementos..." class="w-full border rounded-xl p-2.5 text-sm">
                            </div>
                        </div>

                        <!-- Sección de Preguntas Interactiva al Final -->
                        <div class="space-y-4 pt-4 border-t">
                            <div class="flex justify-between items-center">
                                <h3 class="font-bold text-slate-800">2. Banco de Preguntas Interactivas</h3>
                                <button type="button" onclick="agregarCampoPregunta()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold px-3 py-1.5 rounded-lg transition">
                                    + Agregar Pregunta
                                </button>
                            </div>
                            <div id="contenedorPreguntas" class="space-y-3">
                                <div class="p-4 rounded-xl border bg-slate-50 space-y-2 pregunta-item">
                                    <div class="flex justify-between">
                                        <span class="text-xs font-bold text-blue-600">Pregunta 1</span>
                                    </div>
                                    <input type="text" placeholder="Enuncie la pregunta tipo ICFES..." class="w-full border rounded-lg p-2 text-xs bg-white text-slate-800 pregunta-txt" required>
                                    <input type="text" placeholder="Opciones separadas por comas (Opción A, Opción B...)" class="w-full border rounded-lg p-2 text-xs bg-white text-slate-800 opciones-txt" required>
                                </div>
                            </div>
                        </div>

                        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 rounded-xl transition shadow">
                            Guardar y Publicar Actividad
                        </button>
                    </form>
                </div>
            `;
        }

        function agregarCampoPregunta() {
            const contenedor = document.getElementById('contenedorPreguntas');
            const total = contenedor.children.length + 1;
            const div = document.createElement('div');
            div.className = "p-4 rounded-xl border bg-slate-50 space-y-2 pregunta-item";
            div.innerHTML = `
                <div class="flex justify-between">
                    <span class="text-xs font-bold text-blue-600">Pregunta ${total}</span>
                    <button type="button" onclick="this.parentElement.parentElement.remove()" class="text-rose-500 text-xs font-bold">Eliminar</button>
                </div>
                <input type="text" placeholder="Enuncie la pregunta tipo ICFES..." class="w-full border rounded-lg p-2 text-xs bg-white text-slate-800 pregunta-txt" required>
                <input type="text" placeholder="Opciones separadas por comas (Opción A, Opción B...)" class="w-full border rounded-lg p-2 text-xs bg-white text-slate-800 opciones-txt" required>
            `;
            contenedor.appendChild(div);
        }

        function guardarActividad(e) {
            e.preventDefault();
            const nueva = {
                id: "ACT_" + Math.floor(Math.random() * 900000000 + 100000000),
                fecha: new Date().toLocaleDateString(),
                grado: document.getElementById('formGrado').value,
                link: document.getElementById('formLink').value,
                titulo: document.getElementById('formTitulo').value,
                objetivo: document.getElementById('formObjetivo').value,
                descripcion: "Actividad interactiva con preguntas multimedia.",
                activa: true,
                estudiantesTotal: 30,
                estudiantesCompletados: 0,
                promedioCalificacion: 0
            };
            actividades.unshift(nueva);
            renderMenuGrupos();
            mostrarDashboard();
        }

        // --- MODIFICAR Y ELIMINAR ACTIVIDADES ---
        function eliminarActividad(id) {
            if (confirm("¿Estás seguro de eliminar esta actividad?")) {
                actividades = actividades.filter(a => a.id !== id);
                renderMenuGrupos();
                mostrarDashboard();
            }
        }

        function cargarFormularioModificar(id) {
            const act = actividades.find(a => a.id === id);
            if (!act) return;

            document.getElementById('tituloSeccion').innerText = `Modificar: ${act.titulo}`;
            const contenedor = document.getElementById('contenidoDinamico');

            contenedor.innerHTML = `
                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-8 max-w-2xl mx-auto">
                    <form onsubmit="actualizarActividad(event, '${act.id}')" class="space-y-4">
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Grado Destino</label>
                            <select id="modGrado" class="w-full border rounded-xl p-2.5 text-sm bg-slate-50">
                                ${GRUPOS.map(g => `<option value="${g}" ${g === act.grado ? 'selected' : ''}>${g}</option>`).join('')}
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Link de YouTube</label>
                            <input type="url" id="modLink" value="${act.link}" required class="w-full border rounded-xl p-2.5 text-sm">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Título de la Clase</label>
                            <input type="text" id="modTitulo" value="${act.titulo}" required class="w-full border rounded-xl p-2.5 text-sm">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Objetivo</label>
                            <input type="text" id="modObjetivo" value="${act.objetivo}" required class="w-full border rounded-xl p-2.5 text-sm">
                        </div>
                        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 rounded-xl transition shadow">
                            Actualizar Actividad
                        </button>
                    </form>
                </div>
            `;
        }

        function actualizarActividad(e, id) {
            e.preventDefault();
            const index = actividades.findIndex(a => a.id === id);
            if (index !== -1) {
                actividades[index].grado = document.getElementById('modGrado').value;
                actividades[index].link = document.getElementById('modLink').value;
                actividades[index].titulo = document.getElementById('modTitulo').value;
                actividades[index].objetivo = document.getElementById('modObjetivo').value;
                alert("¡Actividad actualizada correctamente!");
                mostrarDashboard();
            }
        }

        // --- REPORTES INTERACTIVOS EN HTML ---
        function mostrarReporteGlobalInteractivo() {
            document.getElementById('tituloSeccion').innerText = "Reporte Global Consolidado";
            const contenedor = document.getElementById('contenidoDinamico');

            contenedor.innerHTML = `
                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
                    <h3 class="font-bold text-slate-800 mb-4">Consolidado General de Desempeño Académico</h3>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left text-sm">
                            <thead class="bg-slate-50 text-xs font-semibold text-slate-400 border-b">
                                <tr>
                                    <th class="p-3">Actividad</th>
                                    <th class="p-3">Grado</th>
                                    <th class="p-3">Completados</th>
                                    <th class="p-3">Promedio</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y text-slate-700">
                                ${actividades.map(a => `
                                    <tr>
                                        <td class="p-3 font-medium text-slate-800">${a.titulo}</td>
                                        <td class="p-3">${a.grado}</td>
                                        <td class="p-3">${a.estudiantesCompletados} /${a.estudiantesTotal}</td>
                                        <td class="p-3 font-bold text-emerald-600">${a.promedioCalificacion || 'S/N'}</td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        function verEstadisticasActividad(actividadId) {
            const act = actividades.find(a => a.id === actividadId);
            if (!act) return;

            document.getElementById('tituloSeccion').innerText = `Estadísticas: ${act.titulo}`;
            const contenedor = document.getElementById('contenidoDinamico');

            contenedor.innerHTML = `
                <div class="mb-4">
                    <button onclick="mostrarDashboard()" class="text-sm font-semibold text-blue-600 hover:text-blue-800">← Volver</button>
                </div>
                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
                    <h3 class="text-xl font-bold text-slate-900 mb-2">${act.titulo}</h3>
                    <p class="text-sm text-slate-500 mb-6">Grado destino: ${act.grado}</p>
                    <div class="grid grid-cols-2 gap-4 mb-6">
                        <div class="p-4 bg-slate-50 rounded-xl border">
                            <span class="text-xs text-slate-500">Promedio general</span>
                            <p class="text-2xl font-bold text-emerald-600">${act.promedioCalificacion} / 5.0</p>
                        </div>
                        <div class="p-4 bg-slate-50 rounded-xl border">
                            <span class="text-xs text-slate-500">Participación</span>
                            <p class="text-2xl font-bold text-blue-600">${act.estudiantesCompletados} estudiantes</p>
                        </div>
                    </div>
                </div>
            `;
        }

        function filtrarPorGrupo(grupoSeleccionado) {
            const grupoNormalizado = normalizarGrado(grupoSeleccionado);
            document.getElementById('tituloSeccion').innerText = `Actividades de ${grupoNormalizado}`;
            const contenedor = document.getElementById('contenidoDinamico');
            const filtradas = actividades.filter(a => normalizarGrado(a.grado) === grupoNormalizado);

            contenedor.innerHTML = `
                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
                    <h3 class="text-lg font-bold text-slate-800 mb-4">Actividades para ${grupoNormalizado}</h3>
                    ${filtradas.length > 0 ? filtradas.map(a => `<div class="p-3 border rounded-xl mb-2 flex justify-between items-center"><span class="font-bold">${a.titulo}</span><button onclick="eliminarActividad('${a.id}')" class="text-xs text-rose-600">Eliminar</button></div>`).join('') : '<p class="text-sm text-slate-400">Sin actividades registradas.</p>'}
                </div>
            `;
        }

        function cargarVistaEstudiante() {
            const contenedor = document.getElementById("listaActividadesEstudiante");
            const visibles = actividades.filter(a => normalizarGrado(a.grado) === "Sexto 1" && a.activa);
            contenedor.innerHTML = visibles.length > 0 ? visibles.map(act => `
                <div class="border p-4 rounded-xl flex justify-between items-center">
                    <div><h4 class="font-bold">${act.titulo}</h4><p class="text-xs text-slate-500">${act.descripcion}</p></div>
                    <button class="bg-blue-600 text-white text-xs px-4 py-2 rounded-lg">Realizar</button>
                </div>
            `).join('') : '<p class="text-sm text-slate-500">No hay actividades pendientes.</p>';
        }

        window.onload = function() {
            aplicarEstadoSesion();
        };
    </script>
</body>
</html>
