<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plataforma Educativa - Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 font-sans antialiased text-slate-800">

    <!-- ================= PANTALLA DE SELECCIÓN DE ROL / LOGIN ================= -->
    <div id="pantallaLogin" class="min-h-screen flex items-center justify-center p-4">
        <div class="bg-white p-8 rounded-2xl shadow-xl max-w-md w-full border border-slate-200 text-center">
            <div class="w-16 h-16 bg-blue-600 text-white rounded-2xl flex items-center justify-center mx-auto mb-4 text-2xl shadow-md">
                🎓
            </div>
            <h2 class="text-2xl font-bold text-slate-900 mb-2">Plataforma Educativa</h2>
            <p class="text-sm text-slate-500 mb-6">Selecciona tu perfil para ingresar al sistema</p>

            <div class="space-y-4">
                <button onclick="iniciarSesion('docente')" class="w-full flex items-center justify-center gap-3 bg-slate-900 hover:bg-slate-800 text-white font-medium py-3 px-4 rounded-xl transition shadow">
                    👨‍🏫 Ingresar como Docente
                </button>
                <button onclick="iniciarSesion('estudiante')" class="w-full flex items-center justify-center gap-3 bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 px-4 rounded-xl transition shadow">
                    👨‍🎓 Ingresar como Estudiante
                </button>
            </div>
        </div>
    </div>

    <!-- ================= PANEL DOCENTE ================= -->
    <div id="panelDocente" class="hidden flex h-screen overflow-hidden">
        <!-- Menú Lateral -->
        <aside class="w-64 bg-slate-900 text-white flex flex-col shadow-xl z-20">
            <div class="p-5 border-b border-slate-800 flex items-center justify-between">
                <span class="text-lg font-bold tracking-wide">Menú Docente</span>
                <span class="bg-emerald-500/20 text-emerald-400 text-xs px-2 py-0.5 rounded font-mono">En línea</span>
            </div>

            <nav class="flex-1 p-4 space-y-2 overflow-y-auto">
                <button onclick="mostrarDashboard()" class="w-full flex items-center gap-3 px-4 py-2.5 rounded-lg bg-blue-600 hover:bg-blue-700 transition font-medium text-left">
                    📊 Dashboard
                </button>
                <button onclick="mostrarFormularioActividad()" class="w-full flex items-center gap-3 px-4 py-2.5 rounded-lg hover:bg-slate-800 transition font-medium text-left text-slate-300">
                    ➕ Añadir Actividad
                </button>
                
                <div class="pt-5 pb-2 text-xs font-semibold text-slate-400 uppercase tracking-wider">Grupos</div>
                <div class="space-y-1" id="listaGruposDocente">
                    <!-- Se generan dinámicamente -->
                </div>
            </nav>

            <!-- Botón Cerrar Sesión -->
            <div class="p-4 border-t border-slate-800 bg-slate-950/40">
                <button onclick="cerrarSesion()" class="w-full flex items-center justify-center gap-2 px-4 py-2.5 rounded-lg bg-rose-600/20 hover:bg-rose-600 text-rose-300 hover:text-white transition font-medium text-sm">
                    🚪 Cerrar Sesión
                </button>
            </div>
        </aside>

        <!-- Área Principal de Trabajo -->
        <main class="flex-1 flex flex-col overflow-y-auto">
            <header class="bg-white shadow-sm h-16 flex items-center justify-between px-8 border-b border-slate-200">
                <h1 id="tituloSeccion" class="text-xl font-bold text-slate-800">Dashboard General</h1>
                <button onclick="generarReporteGlobal()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition shadow-sm">
                    📊 Generar Reporte Global
                </button>
            </header>

            <div id="contenidoDinamico" class="p-8">
                <!-- Vistas dinámicas -->
            </div>
        </main>
    </div>

    <!-- ================= VISTA ESTUDIANTE (BÁSICA) ================= -->
    <div id="panelEstudiante" class="hidden min-h-screen bg-slate-50 p-8">
        <div class="max-w-4xl mx-auto">
            <div class="flex justify-between items-center bg-white p-6 rounded-2xl shadow-sm mb-6 border">
                <div>
                    <h2 class="text-xl font-bold text-slate-800">Portal Estudiantil</h2>
                    <p class="text-sm text-slate-500">Grupo: Sexto 1</p>
                </div>
                <button onclick="cerrarSesion()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 text-sm font-medium px-4 py-2 rounded-lg transition">
                    Cerrar Sesión
                </button>
            </div>
            <div class="bg-white p-6 rounded-2xl shadow-sm border">
                <h3 class="font-bold text-slate-800 mb-4">Tus Actividades Asignadas</h3>
                <div id="listaActividadesEstudiante" class="space-y-3"></div>
            </div>
        </div>
    </div>

    <script>
        // Lista oficial de grados normalizada
        const GRUPOS = [
            "Sexto 1", "Sexto 2", "Séptimo", "Octavo 1", 
            "Octavo 2", "Noveno", "Décimo", "Once"
        ];

        // Base de datos de ejemplo en memoria
        let actividades = [
            { 
                id: "ACT_179027007", 
                fecha: "24/9/2026", 
                grado: "Sexto 1", 
                link: "https://www.youtube.com/watch?v=G84CdSrYqcc", 
                titulo: "Análisis Pitch de negocios", 
                objetivo: "Identificar elementos clave de un pitch de negocios y marketing.", 
                descripcion: "Analizar el caso real de emprendimiento infantil en Shark Tank.",
                activa: true,
                estudiantesTotal: 32,
                estudiantesCompletados: 26,
                promedioCalificacion: 4.3
            },
            { 
                id: "ACT_179027008", 
                fecha: "22/9/2026", 
                grado: "Séptimo", 
                link: "https://www.youtube.com/watch?v=G84CdSrYqcc", 
                titulo: "Ecosistemas Digitales y Ventas", 
                objetivo: "Reconocer las herramientas de difusión y pauta online.", 
                descripcion: "Taller sobre embudos de venta y redes sociales.",
                activa: true,
                estudiantesTotal: 30,
                estudiantesCompletados: 18,
                promedioCalificacion: 3.9
            },
            { 
                id: "ACT_179027009", 
                fecha: "20/9/2026", 
                grado: "Once", 
                link: "https://www.youtube.com/watch?v=G84CdSrYqcc", 
                titulo: "Estructuración de Capital y Acciones", 
                objetivo: "Analizar la diferencia entre crédito y porcentaje accionario.", 
                descripcion: "Estudio de rondas de inversión y valoraciones comerciales.",
                activa: false,
                estudiantesTotal: 28,
                estudiantesCompletados: 12,
                promedioCalificacion: 4.1
            }
        ];

        // Normalizador de texto para compatibilidad con Google Sheets ("6-1", "Sexto 1", etc.)
        function normalizarGrado(g) {
            if (!g) return "";
            let val = g.toString().trim().toLowerCase();
            if (val === "6-1" || val === "6.1" || val === "sexto 1" || val === "sexto-1") return "Sexto 1";
            if (val === "6-2" || val === "6.2" || val === "sexto 2" || val === "sexto-2") return "Sexto 2";
            if (val === "7" || val === "séptimo" || val === "septimo") return "Séptimo";
            if (val === "8-1" || val === "octavo 1") return "Octavo 1";
            if (val === "8-2" || val === "octavo 2") return "Octavo 2";
            if (val === "9" || val === "noveno") return "Noveno";
            if (val === "10" || val === "décimo" || val === "decimo") return "Décimo";
            if (val === "11" || val === "once") return "Once";
            return g;
        }

        // --- GESTIÓN DE SESIÓN Y VISTAS ---
        function iniciarSesion(rol) {
            sessionStorage.setItem("rol_activo", rol);
            aplicarEstadoSesion();
        }

        function cerrarSesion() {
            sessionStorage.removeItem("rol_activo");
            aplicarEstadoSesion();
        }

        function aplicarEstadoSesion() {
            const rol = sessionStorage.getItem("rol_activo");
            const pantallaLogin = document.getElementById("pantallaLogin");
            const panelDocente = document.getElementById("panelDocente");
            const panelEstudiante = document.getElementById("panelEstudiante");

            pantallaLogin.classList.add("hidden");
            panelDocente.classList.add("hidden");
            panelEstudiante.classList.add("hidden");

            if (rol === "docente") {
                panelDocente.classList.remove("hidden");
                renderMenuGrupos();
                mostrarDashboard();
            } else if (rol === "estudiante") {
                panelEstudiante.classList.remove("hidden");
                cargarVistaEstudiante();
            } else {
                pantallaLogin.classList.remove("hidden");
            }
        }

        function renderMenuGrupos() {
            const contenedor = document.getElementById("listaGruposDocente");
            contenedor.innerHTML = GRUPOS.map(grupo => `
                <button onclick="filtrarPorGrupo('${grupo}')" class="w-full text-left px-4 py-2 rounded-lg hover:bg-slate-800 text-slate-300 transition text-sm flex justify-between items-center">
                    <span>${grupo}</span>
                    <span class="text-xs bg-slate-800 px-1.5 py-0.5 rounded text-slate-400 font-mono">
                        ${actividades.filter(a => normalizarGrado(a.grado) === grupo).length}
                    </span>
                </button>
            `).join('');
        }

        // --- DASHBOARD DOCENTE CON ESTADÍSTICAS POR GRADO ---
        function mostrarDashboard() {
            document.getElementById('tituloSeccion').innerText = "Dashboard General";
            const contenedor = document.getElementById('contenidoDinamico');

            const totalActividades = actividades.length;
            const actividadesActivas = actividades.filter(a => a.activa).length;

            // Calcular avance estadístico por grado
            const statsPorGrado = GRUPOS.map(grupo => {
                const acts = actividades.filter(a => normalizarGrado(a.grado) === grupo);
                if (acts.length === 0) return { grupo, avance: 0, promedio: 0, totalActs: 0 };
                
                const totalEsperados = acts.reduce((acc, curr) => acc + (curr.estudiantesTotal || 0), 0);
                const totalHechos = acts.reduce((acc, curr) => acc + (curr.estudiantesCompletados || 0), 0);
                const porcentaje = totalEsperados > 0 ? Math.round((totalHechos / totalEsperados) * 100) : 0;
                const prom = (acts.reduce((acc, curr) => acc + (curr.promedioCalificacion || 0), 0) / acts.length).toFixed(1);
                
                return { grupo, avance: porcentaje, promedio: prom, totalActs: acts.length };
            });

            contenedor.innerHTML = `
                <!-- Métricas Principales -->
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                        <h4 class="text-xs font-bold text-slate-400 uppercase tracking-wider">Total de Actividades</h4>
                        <p class="text-3xl font-extrabold text-slate-900 mt-2">${totalActividades}</p>
                        <p class="text-xs text-slate-500 mt-1">${actividadesActivas} activas en plataforma</p>
                    </div>
                    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                        <h4 class="text-xs font-bold text-slate-400 uppercase tracking-wider">Grupos Cubiertos</h4>
                        <p class="text-3xl font-extrabold text-indigo-600 mt-2">${GRUPOS.length}</p>
                        <p class="text-xs text-slate-500 mt-1">Sexto a Once</p>
                    </div>
                    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                        <h4 class="text-xs font-bold text-slate-400 uppercase tracking-wider">Promedio de Cumplimiento Global</h4>
                        <p class="text-3xl font-extrabold text-emerald-600 mt-2">76%</p>
                        <p class="text-xs text-slate-500 mt-1">Participación en cuestionarios</p>
                    </div>
                </div>

                <!-- Estadísticas de Avance por Grados -->
                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 mb-8">
                    <h3 class="text-base font-bold text-slate-800 mb-4">Avance y Rendimiento por Grados</h3>
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                        ${statsPorGrado.map(st => `
                            <div class="p-4 rounded-xl border border-slate-100 bg-slate-50/50">
                                <div class="flex justify-between items-center mb-2">
                                    <span class="font-bold text-sm text-slate-800">${st.grupo}</span>
                                    <span class="text-xs font-bold px-2 py-0.5 rounded ${st.promedio >= 4.0 ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'}">
                                        Nota: ${st.promedio > 0 ? st.promedio : 'S/N'}
                                    </span>
                                </div>
                                <div class="w-full bg-slate-200 rounded-full h-2 mb-2">
                                    <div class="bg-blue-600 h-2 rounded-full transition-all" style="width: ${st.avance}%"></div>
                                </div>
                                <div class="flex justify-between text-xs text-slate-500">
                                    <span>${st.totalActs} act. asignada(s)</span>
                                    <span>${st.avance}% completado</span>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>

                <!-- Tabla de Actividades con Redirección a Estadísticas -->
                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="text-base font-bold text-slate-800">Actividades Creadas</h3>
                        <span class="text-xs text-slate-400">Haz clic en cualquier actividad para abrir sus estadísticas</span>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="border-b text-xs font-semibold text-slate-400 uppercase bg-slate-50/50">
                                    <th class="p-3">ID</th>
                                    <th class="p-3">Grado</th>
                                    <th class="p-3">Título</th>
                                    <th class="p-3">Fecha</th>
                                    <th class="p-3">Estado</th>
                                    <th class="p-3 text-right">Acción</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y text-sm">
                                ${actividades.map(a => `
                                    <tr onclick="verEstadisticasActividad('${a.id}')" class="hover:bg-blue-50/50 cursor-pointer transition">
                                        <td class="p-3 font-mono text-xs text-blue-600 font-semibold">${a.id}</td>
                                        <td class="p-3 font-medium text-slate-800">${a.grado}</td>
                                        <td class="p-3 text-slate-700">${a.titulo}</td>
                                        <td class="p-3 text-slate-500 text-xs">${a.fecha}</td>
                                        <td class="p-3">
                                            <span class="text-xs px-2.5 py-1 rounded-full font-semibold ${a.activa ? 'bg-emerald-100 text-emerald-800' : 'bg-slate-200 text-slate-600'}">
                                                ${a.activa ? 'Activa' : 'Desactivada'}
                                            </span>
                                        </td>
                                        <td class="p-3 text-right">
                                            <span class="text-xs font-semibold text-blue-600 hover:text-blue-800">Ver Reporte ➔</span>
                                        </td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        // --- VISTA DETALLADA DE ESTADÍSTICAS POR ACTIVIDAD (AL DAR CLIC) ---
        function verEstadisticasActividad(actividadId) {
            const act = actividades.find(a => a.id === actividadId);
            if (!act) return;

            document.getElementById('tituloSeccion').innerText = `Estadísticas: ${act.titulo}`;
            const contenedor = document.getElementById('contenidoDinamico');

            const porcentajeEntrega = Math.round((act.estudiantesCompletados / act.estudiantesTotal) * 100);

            contenedor.innerHTML = `
                <div class="mb-4">
                    <button onclick="mostrarDashboard()" class="text-sm font-semibold text-blue-600 hover:text-blue-800 flex items-center gap-1">
                        ← Volver al Dashboard
                    </button>
                </div>

                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 mb-6">
                    <div class="flex flex-col md:flex-row justify-between items-start md:items-center border-b pb-4 mb-4 gap-4">
                        <div>
                            <span class="text-xs font-mono font-bold text-blue-600 bg-blue-50 px-2 py-1 rounded">${act.id}</span>
                            <span class="text-xs font-bold text-slate-600 ml-2 bg-slate-100 px-2 py-1 rounded">${act.grado}</span>
                            <h2 class="text-2xl font-bold text-slate-900 mt-2">${act.titulo}</h2>
                            <p class="text-sm text-slate-600 mt-1">${act.objetivo}</p>
                        </div>
                        <div class="flex items-center gap-2">
                            <button onclick="toggleEstadoActividad('${act.id}', true)" class="px-4 py-2 rounded-lg text-sm font-semibold transition ${act.activa ? 'bg-amber-100 text-amber-800 hover:bg-amber-200' : 'bg-emerald-600 text-white hover:bg-emerald-700'}">
                                ${act.activa ? '⏸ Desactivar Actividad' : '▶ Activar Actividad'}
                            </button>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                        <div class="bg-slate-50 border p-4 rounded-xl">
                            <span class="text-xs font-semibold text-slate-500">Estudiantes que han respondido</span>
                            <p class="text-2xl font-bold text-slate-800 mt-1">${act.estudiantesCompletados} / ${act.estudiantesTotal}</p>
                            <div class="w-full bg-slate-200 rounded-full h-1.5 mt-2">
                                <div class="bg-blue-600 h-1.5 rounded-full" style="width: ${porcentajeEntrega}%"></div>
                            </div>
                        </div>
                        <div class="bg-slate-50 border p-4 rounded-xl">
                            <span class="text-xs font-semibold text-slate-500">Promedio General</span>
                            <p class="text-2xl font-bold text-emerald-600 mt-1">${act.promedioCalificacion} / 5.0</p>
                            <p class="text-xs text-slate-400 mt-1">Escala tipo Saber / ICFES</p>
                        </div>
                        <div class="bg-slate-50 border p-4 rounded-xl">
                            <span class="text-xs font-semibold text-slate-500">Material de Trabajo</span>
                            <p class="mt-1">
                                <a href="${act.link}" target="_blank" class="text-sm text-blue-600 hover:underline font-medium inline-flex items-center gap-1">
                                    Ver Video en YouTube ↗
                                </a>
                            </p>
                        </div>
                    </div>

                    <h4 class="font-bold text-slate-800 mb-3 text-sm">Registro de Respuestas de Estudiantes</h4>
                    <div class="border rounded-xl overflow-hidden">
                        <table class="w-full text-left text-sm">
                            <thead class="bg-slate-50 text-xs font-semibold text-slate-500 border-b">
                                <tr>
                                    <th class="p-3">Estudiante</th>
                                    <th class="p-3">Aciertos (10 preguntas)</th>
                                    <th class="p-3">Calificación</th>
                                    <th class="p-3">Estado</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y text-slate-700">
                                <tr>
                                    <td class="p-3 font-medium">Camila Andrea Morales</td>
                                    <td class="p-3">9 / 10</td>
                                    <td class="p-3 font-bold text-emerald-600">4.5</td>
                                    <td class="p-3"><span class="bg-emerald-100 text-emerald-800 text-xs px-2 py-0.5 rounded font-semibold">Aprobado</span></td>
                                </tr>
                                <tr>
                                    <td class="p-3 font-medium">Juan David Sánchez</td>
                                    <td class="p-3">8 / 10</td>
                                    <td class="p-3 font-bold text-emerald-600">4.0</td>
                                    <td class="p-3"><span class="bg-emerald-100 text-emerald-800 text-xs px-2 py-0.5 rounded font-semibold">Aprobado</span></td>
                                </tr>
                                <tr>
                                    <td class="p-3 font-medium">Mateo Gómez Ríos</td>
                                    <td class="p-3">5 / 10</td>
                                    <td class="p-3 font-bold text-rose-600">2.5</td>
                                    <td class="p-3"><span class="bg-rose-100 text-rose-800 text-xs px-2 py-0.5 rounded font-semibold">Reprobado</span></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        // --- FILTRO POR GRUPO CON OPCIÓN DE DESACTIVAR / ACTIVAR ---
        function filtrarPorGrupo(grupoSeleccionado) {
            const grupoNormalizado = normalizarGrado(grupoSeleccionado);
            document.getElementById('tituloSeccion').innerText = `Actividades de ${grupoNormalizado}`;
            const contenedor = document.getElementById('contenidoDinamico');

            const filtradas = actividades.filter(a => normalizarGrado(a.grado) === grupoNormalizado);

            contenedor.innerHTML = `
                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
                    <div class="flex justify-between items-center mb-6">
                        <div>
                            <h3 class="text-lg font-bold text-slate-800">Listado de Actividades Asignadas</h3>
                            <p class="text-sm text-slate-500">Puedes pausar o activar actividades para este grupo en cualquier momento.</p>
                        </div>
                        <button onclick="mostrarFormularioActividad()" class="bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium px-4 py-2 rounded-lg transition">
                            + Asignar a este grupo
                        </button>
                    </div>

                    ${filtradas.length > 0 ? `
                        <div class="space-y-4">
                            ${filtradas.map(act => `
                                <div class="border rounded-xl p-5 bg-slate-50/70 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                                    <div>
                                        <div class="flex items-center gap-2 mb-1">
                                            <span class="text-xs font-mono font-bold text-blue-600 bg-blue-50 px-2 py-0.5 rounded">${act.id}</span>
                                            <span class="text-xs px-2 py-0.5 rounded-full font-bold ${act.activa ? 'bg-emerald-100 text-emerald-800' : 'bg-slate-200 text-slate-600'}">
                                                ${act.activa ? 'Visible para Estudiantes' : 'Desactivada'}
                                            </span>
                                        </div>
                                        <h4 class="font-bold text-slate-900 text-base">${act.titulo}</h4>
                                        <p class="text-sm text-slate-600 mt-1">${act.objetivo}</p>
                                    </div>
                                    <div class="flex items-center gap-2">
                                        <button onclick="verEstadisticasActividad('${act.id}')" class="px-3 py-1.5 bg-white border border-slate-300 text-slate-700 hover:bg-slate-100 text-xs font-medium rounded-lg shadow-sm transition">
                                            📊 Métricas
                                        </button>
                                        <button onclick="toggleEstadoActividad('${act.id}', false, '${grupoNormalizado}')" class="px-3 py-1.5 text-xs font-medium rounded-lg transition ${act.activa ? 'bg-rose-50 text-rose-700 hover:bg-rose-100 border border-rose-200' : 'bg-emerald-600 text-white hover:bg-emerald-700'}">
                                            ${act.activa ? 'Desactivar' : 'Activar'}
                                        </button>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    ` : `
                        <div class="p-12 text-center text-slate-400 bg-slate-50 rounded-xl border border-dashed">
                            No hay actividades asignadas a ${grupoNormalizado}.
                        </div>
                    `}
                </div>
            `;
        }

        // Función para cambiar estado Activa / Desactivada
        function toggleEstadoActividad(id, redirigirAEstadisticas = false, grupoOrigen = null) {
            const index = actividades.findIndex(a => a.id === id);
            if (index !== -1) {
                actividades[index].activa = !actividades[index].activa;
                if (redirigirAEstadisticas) {
                    verEstadisticasActividad(id);
                } else if (grupoOrigen) {
                    filtrarPorGrupo(grupoOrigen);
                } else {
                    mostrarDashboard();
                }
            }
        }

        // --- FORMULARIO NUEVA ACTIVIDAD ---
        function mostrarFormularioActividad() {
            document.getElementById('tituloSeccion').innerText = "Crear Nueva Actividad";
            const contenedor = document.getElementById('contenidoDinamico');

            contenedor.innerHTML = `
                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-8 max-w-2xl mx-auto">
                    <form onsubmit="guardarActividad(event)" class="space-y-4">
                        <div>
                            <label class="block text-sm font-semibold text-slate-700 mb-1">Grado Destino</label>
                            <select id="formGrado" class="w-full border rounded-xl p-2.5 text-sm bg-slate-50">
                                ${GRUPOS.map(g => `<option value="${g}">${g}</option>`).join('')}
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-slate-700 mb-1">Link de YouTube</label>
                            <input type="url" id="formLink" required placeholder="https://www.youtube.com/watch?v=..." class="w-full border rounded-xl p-2.5 text-sm">
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-slate-700 mb-1">Título de la Clase</label>
                            <input type="text" id="formTitulo" required placeholder="Ej: Análisis Pitch de negocios" class="w-full border rounded-xl p-2.5 text-sm">
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-slate-700 mb-1">Objetivo de la Actividad</label>
                            <input type="text" id="formObjetivo" required placeholder="Ej: Identificar los elementos clave..." class="w-full border rounded-xl p-2.5 text-sm">
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-slate-700 mb-1">Descripción</label>
                            <textarea id="formDescripcion" rows="3" class="w-full border rounded-xl p-2.5 text-sm" placeholder="Instrucciones para los estudiantes..."></textarea>
                        </div>
                        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 rounded-xl transition shadow">
                            Guardar y Asignar Actividad
                        </button>
                    </form>
                </div>
            `;
        }

        function guardarActividad(e) {
            e.preventDefault();
            const nueva = {
                id: "ACT_" + Math.floor(Math.random() * 900000000 + 100000000),
                fecha: new Date().toLocaleDateString(),
                grado: document.getElementById('formGrado').value,
                link: document.getElementById('formLink').value,
                titulo: document.getElementById('formTitulo').value,
                objetivo: document.getElementById('formObjetivo').value,
                descripcion: document.getElementById('formDescripcion').value,
                activa: true,
                estudiantesTotal: 30,
                estudiantesCompletados: 0,
                promedioCalificacion: 0
            };
            actividades.unshift(nueva);
            renderMenuGrupos();
            mostrarDashboard();
        }

        function cargarVistaEstudiante() {
            const contenedor = document.getElementById("listaActividadesEstudiante");
            // Solo muestra actividades activas del grupo asignado (ej. Sexto 1)
            const visibles = actividades.filter(a => normalizarGrado(a.grado) === "Sexto 1" && a.activa);

            if (visibles.length === 0) {
                contenedor.innerHTML = `<p class="text-sm text-slate-500">No tienes actividades pendientes por responder.</p>`;
                return;
            }

            contenedor.innerHTML = visibles.map(act => `
                <div class="border p-4 rounded-xl flex justify-between items-center">
                    <div>
                        <h4 class="font-bold text-slate-800">${act.titulo}</h4>
                        <p class="text-xs text-slate-500">${act.descripcion}</p>
                    </div>
                    <button class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold px-4 py-2 rounded-lg transition">
                        Comenzar Actividad
                    </button>
                </div>
            `).join('');
        }

        function generarReporteGlobal() {
            alert("Descargando informe consolidado en formato de calificaciones...");
        }

        // Inicio automático según el estado de la sesión guardado
        window.onload = function() {
            aplicarEstadoSesion();
        };
    </script>
</body>
</html>
