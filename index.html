<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plataforma Interactiva - I.E. San Juan Bosco</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex flex-col min-h-screen">

    <!-- LOGIN PANEL -->
    <div id="login-panel" class="flex-grow flex items-center justify-center p-4">
        <div class="bg-white p-8 rounded-lg shadow-lg w-full max-w-md">
            <h2 class="text-2xl font-bold text-center mb-6">Ingreso a la Plataforma</h2>
            
            <!-- Botones de selección de rol -->
            <div class="flex justify-center space-x-4 mb-6">
                <button onclick="setRole('estudiante')" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded transition-colors">Estudiante</button>
                <button onclick="setRole('docente')" class="px-4 py-2 bg-gray-600 hover:bg-gray-700 text-white rounded transition-colors">Docente</button>
            </div>

            <!-- Formulario Estudiante -->
            <form id="form-estudiante" class="hidden space-y-4">
                <select id="grado" class="w-full p-2 border rounded" onchange="cargarCodigos()">
                    <option value="">Seleccione Grado</option>
                    <option value="6-1">Sexto 1</option>
                    <option value="6-2">Sexto 2</option>
                    <option value="7">Séptimo</option>
                    <option value="8-1">Octavo 1</option>
                    <option value="8-2">Octavo 2</option>
                    <option value="9">Noveno</option>
                    <option value="10">Décimo</option>
                    <option value="11">Once</option>
                </select>
                <select id="codigo" class="w-full p-2 border rounded disabled:opacity-50" disabled>
                    <option value="">Seleccione Código</option>
                </select>
                <input type="password" id="pass-estudiante" placeholder="Contraseña (Ej: 12A)" class="w-full p-2 border rounded">
                <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white py-2 rounded font-bold transition-colors">Ingresar como Estudiante</button>
            </form>

            <!-- Formulario Docente -->
            <form id="form-docente" class="hidden space-y-4">
                <input type="password" id="pass-docente" placeholder="Contraseña de Administrador" class="w-full p-2 border rounded">
                <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white py-2 rounded font-bold transition-colors">Ingresar como Docente</button>
            </form>

            <div class="text-center mt-4">
                <a href="#" class="text-xs text-gray-400 hover:text-blue-500 transition-colors">¿Olvidaste o deseas cambiar tu contraseña?</a>
            </div>
        </div>
    </div>

    <!-- PANEL DOCENTE (Oculto por defecto) -->
    <div id="panel-docente" class="hidden flex-grow flex">
        <aside class="w-64 bg-gray-800 text-white p-4">
            <h3 class="font-bold text-lg mb-4">Grupos</h3>
            <ul class="space-y-2 text-sm">
                <li class="cursor-pointer hover:bg-gray-700 p-2 rounded">Sexto 1</li>
                <li class="cursor-pointer hover:bg-gray-700 p-2 rounded">Once</li>
            </ul>
        </aside>
        <main class="flex-1 p-8">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-3xl font-bold">Dashboard de Docente</h2>
                <button class="bg-blue-600 text-white px-4 py-2 rounded shadow">+ Añadir Actividad</button>
            </div>
            <p>Bienvenido, Alejandro. Aquí podrás configurar los videos y ver las notas.</p>
        </main>
    </div>

    <footer class="bg-gray-900 text-gray-400 py-6 mt-auto text-sm text-center">
        <div class="max-w-4xl mx-auto px-4">
            <p class="font-semibold text-gray-200">Alejandro Martínez Caicedo</p>
            <p>Emprendimiento | Tecnología y café</p>
            <p class="mt-2 text-xs">Institución Educativa San Juan Bosco</p>
        </div>
    </footer>

    <!-- SCRIPT INTEGRADO PARA EVITAR ERRORES DE RUTAS -->
    <script>
        // 1. Alternar entre formularios de Docente y Estudiante
        function setRole(role) {
            const formEst = document.getElementById('form-estudiante');
            const formDoc = document.getElementById('form-docente');

            if (role === 'estudiante') {
                formEst.classList.remove('hidden');
                formDoc.classList.add('hidden');
            } else if (role === 'docente') {
                formDoc.classList.remove('hidden');
                formEst.classList.add('hidden');
            }
        }

        // 2. Habilitar la lista de códigos cuando se elige un grado
        function cargarCodigos() {
            const grado = document.getElementById('grado').value;
            const codigoSelect = document.getElementById('codigo');
            
            if (grado !== "") {
                codigoSelect.disabled = false;
                // Aquí luego conectaremos con Google Sheets, por ahora ponemos datos de prueba:
                codigoSelect.innerHTML = `
                    <option value="">Seleccione Código</option>
                    <option value="01">01</option>
                    <option value="02">02</option>
                    <option value="03">03</option>
                `;
            } else {
                codigoSelect.disabled = true;
                codigoSelect.innerHTML = '<option value="">Seleccione Código</option>';
            }
        }

        // 3. Simulación de Ingreso del Docente
        document.getElementById('form-docente').addEventListener('submit', function(e) {
            e.preventDefault(); // Evita que la página se recargue
            const pass = document.getElementById('pass-docente').value;
            
            if (pass === 'AdminDocente') {
                document.getElementById('login-panel').classList.add('hidden');
                document.getElementById('panel-docente').classList.remove('hidden');
            } else {
                alert('Contraseña incorrecta');
            }
        });
    </script>
</body>
</html>
